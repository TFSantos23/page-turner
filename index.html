<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>É para ler o quê?</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>OÉ para ler o quê?</h1>

<label>Altura
  <select id="mood">
    <option value="">Qualquer altura</option>
    <option value="férias">Férias</option>
    <option value="aulas">Aulas</option>
    <option value="avaliações">Avaliações</option>
  </select>
</label>

<label>Número de Páginas
  <input type="number" id="pages">
</label>

<fieldset id="genre">
  <legend>Género</legend>
  <label><input type="checkbox" value="sci-fi/fantasia"> Sci-Fi/Fantasia</label>
  <label><input type="checkbox" value="humor"> Humor</label>
  <label><input type="checkbox" value="romance"> Romance</label>
  <label><input type="checkbox" value="clássicos"> Clássicos</label>
  <label><input type="checkbox" value="não ficção"> Não-Ficção</label>
  <label><input type="checkbox" value="histórico"> Histórico</label>
  <label><input type="checkbox" value="criminal"> Criminal</label>
  <label><input type="checkbox" value="thriller"> Thriller</label>
  <label><input type="checkbox" value="contos"> Contos</label>
</fieldset>

<br><br>
<button id="pick">Ver opções</button>
<button id="more" hidden>Mais alternativas</button>
<button id="clear">Limpar filtros</button>

<p id="message">À espera que isto funcione…</p>

<div id="results"></div>
<button id="all" hidden>Show all options</button>

  <script src="script.js"></script>
</body>
</html>
