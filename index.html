<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>É para ler o quê?</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>É para ler o quê?</h1>

<div class="filter">
  <span class="filter-title"></span>
  <div class="segmented" id="language">
    <label><input type="radio" name="language" value="" checked><span>Qualquer</span></label>
    <label><input type="radio" name="language" value="português"><span>Português</span></label>
    <label><input type="radio" name="language" value="inglês"><span>Inglês</span></label>
  </div>
</div>
  
<label>
  <select id="mood">
    <option value="">Qualquer altura</option>
    <option value="férias">Férias</option>
    <option value="aulas">Aulas</option>
    <option value="avaliações">Avaliações</option>
  </select>
</label>

<label>Páginas
  <input type="number" id="pages">
</label>

<fieldset id="genre" class="chips">
  <label><input type="checkbox" value="sci-fi/fantasia"><span>Sci-fi/Fantasia</span></label>
  <label><input type="checkbox" value="humor"><span>Humor</span></label>
  <label><input type="checkbox" value="romance"><span>Romance</span></label>
  <label><input type="checkbox" value="clássicos"><span>Clássicos</span></label>
  <label><input type="checkbox" value="não ficção"><span>Não Ficção</span></label>
  <label><input type="checkbox" value="histórico"><span>Histórico</span></label>
  <label><input type="checkbox" value="criminal"><span>Criminal</span></label>
  <label><input type="checkbox" value="thriller"><span>Thriller</span></label>
  <label><input type="checkbox" value="contos"><span>Contos</span></label>
</fieldset>
  
<br><br>
<button id="pick">Ver opções</button>
<button id="more" hidden>Mais alternativas</button>
<button id="clear">Limpar filtros</button>

<p id="message">À espera que isto funcione…</p>

<div id="results"></div>
<button id="all" hidden>Ver todos</button>

  <script src="script.js"></script>
</body>
</html>
